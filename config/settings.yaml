# ============================================================
# 猎场系统 V6.0 "Genesis" — 全局配置
# ============================================================

system:
  name: "猎场系统 V6.0"
  version: "6.0.0"
  mode: "paper"  # paper | live | hybrid
  log_level: "INFO"
  log_dir: "./logs"
  data_dir: "./data"

# ----------------------------------------------------------
# 资金配置（200万 / 50亿以下小市值）
# ----------------------------------------------------------
capital:
  total: 2000000.0          # 总资金（元）
  max_positions: 6          # 最大持仓数（分散风险）
  max_single_position_pct: 0.25  # 单票最大仓位 25%（约50万/只）
  min_cash_reserve_pct: 0.10     # 最低现金保留 10%
  min_stock_price: 3.0      # 最低股价
  max_stock_price: 80.0     # 最高股价（200万可覆盖更大范围）
  min_market_cap: 10.0      # 最低市值（亿）
  max_market_cap: 50.0      # 最高市值（亿）≤50亿小盘股

# ----------------------------------------------------------
# 交易成本
# ----------------------------------------------------------
commission:
  stamp_tax: 0.0005         # 印花税 0.05%（仅卖出）
  broker_fee: 0.00025       # 佣金 0.025%（买卖双向）
  transfer_fee: 0.00001     # 过户费 0.001%
  min_broker_fee: 5.0       # 最低佣金 5元

# ----------------------------------------------------------
# 投资品种优先级
# ----------------------------------------------------------
instruments:
  convertible_bond:
    enabled: true
    capital_pct: 0.40       # 配置 40% 资金
    tick: "T+0"
    stamp_tax_free: true
    min_price: 100.0         # 转债面值
    max_price: 130.0
    double_low_max: 130.0    # 双低阈值（价格+溢价率*100）
    stop_loss_pct: -0.03    # 止损 -3%

  a_share:
    enabled: true
    capital_pct: 0.50       # 配置 50% 资金
    tick: "T+1"
    focus: "small_cap"      # 20-100亿小市值
    stop_loss_pct: -0.05    # 止损 -5%

  hk_stock:
    enabled: false           # 默认关闭，需港股通权限
    capital_pct: 0.10
    tick: "T+0"
    via: "shanghai_connect"

  etf:
    enabled: true
    capital_pct: 0.10
    tick: "T+1"
    stamp_tax_free: true
    focus: ["CSI500", "CSI1000", "GEM"]

# ----------------------------------------------------------
# 数据源
# ----------------------------------------------------------
data_sources:
  primary:
    name: "tushare"
    token: "${TUSHARE_TOKEN}"   # 环境变量
    rate_limit: 200              # 每分钟请求上限
  fallback:
    name: "akshare"
    rate_limit: 60
  realtime:
    name: "tencent_websocket"
    symbols_batch_size: 50
  news:
    name: "eastmoney"
    nlp_model: "bert-base-chinese-finetuned"

# ----------------------------------------------------------
# 调度配置
# ----------------------------------------------------------
schedule:
  market_scan_interval: 1200    # 全市场扫描间隔（秒）20分钟
  flash_scan_interval: 300      # 异动扫描间隔 5分钟
  news_fetch_interval: 300      # 新闻抓取间隔
  data_sync_interval: 1200      # 数据同步间隔
  stop_loss_check_interval: 60  # 止损检查间隔
  sentiment_update_interval: 900 # 情绪更新间隔 15分钟

# ----------------------------------------------------------
# 交易时段
# ----------------------------------------------------------
trading_hours:
  morning_start: "09:30"
  morning_end: "11:30"
  afternoon_start: "13:00"
  afternoon_end: "15:00"
  call_auction: "09:15"    # 集合竞价开始
  pre_market_scan: "09:00"  # 盘前扫描
  post_market_review: "15:30" # 盘后复盘

# ----------------------------------------------------------
# 通知推送
# ----------------------------------------------------------
notifications:
  wechat:
    enabled: true
    webhook_url: "${WECHAT_WEBHOOK}"
  dingtalk:
    enabled: false
    webhook_url: "${DINGTALK_WEBHOOK}"
  email:
    enabled: false
    smtp_host: "smtp.qq.com"
    smtp_port: 587
    sender: "${EMAIL_SENDER}"
  system_tray:
    enabled: true

# ----------------------------------------------------------
# LLM 配置（本地 + 云端备选）
# ----------------------------------------------------------
llm:
  local:
    provider: "ollama"
    model: "qwen2.5:7b"
    base_url: "http://localhost:11434"
    temperature: 0.3
    max_tokens: 2048
  cloud:
    provider: "deepseek"
    model: "deepseek-chat"
    api_key: "${DEEPSEEK_API_KEY}"
    api_base: "https://api.deepseek.com/v1"
    fallback: true  # 本地不可用时自动切换
